# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4

# Java version used to compile the mod and required at runtime.
java_version=25

# Mod Properties
# The published version is "<mod_version>+<minecraft_version>".
mod_version=1.1.0
group=com.urntt

# Dependencies
fabric_api_version=0.166.2+26.3
modmenu_version=21.0.1
# OneConfig is optional; the mod only compiles against its config API.
oneconfig_version=1.8.0
# Modrinth version ids of OneConfig and its dependencies for the Minecraft version above, loaded into the
# development client only with -PoneConfigRuntime=true (ids, because version numbers are shared across loaders).
oneconfig_modrinth_id=BWieDkB8
fabric_language_kotlin_modrinth_id=SKW1BTL3
polycompose_modrinth_id=bMhjbdhu
